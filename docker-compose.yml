services:
  huashi:
    build: .
    container_name: huashi
    restart: unless-stopped
    ports:
      - "8787:8787"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./pose:/app/pose:ro
      - ./promptscreation:/app/promptscreation:ro
      - ./inspiration:/app/inspiration:ro
      - ./inspiration/user-data:/app/inspiration/user-data:rw
