name: Verify Huashi
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/*.cjs scripts/test_*.cjs
      - name: Build container without private assets
        run: docker build -t huashi:verify .
      - name: Verify clean container HTTP startup
        run: |
          docker run -d --name huashi-verify -p 127.0.0.1:18787:8787 huashi:verify
          python - <<'PY'
          import gzip,json,urllib.request,time
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18787/api/apps',timeout=2) as response:
                      assert response.status==200
                  break
              except OSError:
                  if attempt==29:raise
                  time.sleep(1)
          for name in ['portrait-materials.json','portrait-materials.json.gz']:
              with urllib.request.urlopen('http://127.0.0.1:18787/'+name) as r:
                  data=r.read()
              if name.endswith('.gz'):data=gzip.decompress(data)
              assert json.loads(data)==[]
          PY
      - if: always()
        run: docker logs huashi-verify 2>/dev/null || true
      - if: always()
        run: docker rm -f huashi-verify 2>/dev/null || true
