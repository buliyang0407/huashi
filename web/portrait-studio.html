<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人像工坊 · 画室</title><style>
:root{--paper:#f6f6f8;--ink:#302c39;--muted:#817c89;--purple:#675477;--line:#e5e2e9;--soft:#eee9f2}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit;background:none;border:0}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--purple);outline-offset:3px}button:hover{color:var(--purple)}header{height:78px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 4%;gap:50px;position:sticky;top:0;z-index:5}.logo{font-family:"Songti SC",serif;font-size:28px;letter-spacing:5px}nav{display:flex;gap:30px;height:100%;align-items:center}nav button{height:100%;position:relative;color:var(--muted)}nav button.active{color:var(--ink)}nav button.active:after{content:'';position:absolute;height:3px;background:var(--purple);bottom:0;left:0;right:0}.bag-trigger{margin-left:auto;border:1px solid var(--line);border-radius:24px;padding:11px 19px;display:flex;gap:10px;align-items:center}.badge{background:var(--purple);color:white;border-radius:50%;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px}main{max-width:1500px;margin:auto;padding:34px 4% 70px}.crumb{color:var(--muted);font-size:12px;margin-bottom:19px}.titleline{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-family:"Songti SC","Noto Serif CJK SC",serif;font-weight:500;font-size:34px;margin:0 0 10px}p{line-height:1.7}.sub{margin:0;color:var(--muted)}.search{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 16px;width:250px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:30px 0 20px;padding-bottom:20px;border-bottom:1px solid var(--line)}.tabs button{padding:9px 19px;border-radius:22px;color:#6c6673}.tabs button.active{background:var(--purple);color:white}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:26px 20px}.card{min-width:0}.photo{position:relative;background:#ecebef;border-radius:10px;overflow:hidden;aspect-ratio:3/4}.photo>button:first-child{display:block;width:100%;height:100%;padding:0}.photo img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .2s}.photo:hover img{transform:scale(1.025)}.add{position:absolute;right:10px;bottom:10px;width:33px;height:33px;border-radius:50%;background:#fffffff2;font-size:24px;box-shadow:0 2px 8px #0001}.add.on{background:var(--purple);color:white;font-size:17px}.caption{padding:11px 1px 0;display:flex;align-items:start;justify-content:space-between;gap:5px}.name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;text-align:left;padding:0;max-width:100%}.copyline{display:block;font-size:12px;color:var(--purple);padding:6px 0 2px;text-align:left}.copyline:hover{text-decoration:underline}.copyline.copied{color:#447258}.hint{color:var(--muted);font-size:11px;margin-top:5px}.empty{padding:65px 20px;text-align:center;color:var(--muted);grid-column:1/-1}.overlay{position:fixed;inset:0;background:#24202e44;z-index:10;display:flex;justify-content:flex-end}.drawer{background:#faf9fc;width:min(540px,100%);height:100%;display:flex;flex-direction:column;box-shadow:-10px 0 60px #28213113}.panelhead{padding:27px 28px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:start}.panelhead h2{font-size:23px;font-weight:500;margin:0 0 8px}.panelhead p{color:var(--muted);font-size:12px;margin:0}.close{font-size:26px;line-height:1;padding:5px}.bagbody{overflow:auto;padding:24px 28px;flex:1}.baggrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 12px}.baggrid .name{font-size:12px}.baggrid .photo{border-radius:7px}.tools{display:flex;justify-content:space-between;margin-top:7px;gap:4px}.tools button{font-size:11px;color:var(--purple);padding:3px 0}.foot{padding:18px 28px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:white}.primary{background:var(--purple);color:white;border-radius:7px;padding:12px 21px}.primary:hover{background:#594467;color:white}.secondary{border:1px solid var(--line);background:white;border-radius:7px;padding:11px 18px}.detail-overlay{z-index:20;justify-content:center;align-items:center;padding:28px}.detail{position:relative;background:white;border-radius:14px;display:grid;grid-template-columns:1.1fr 1fr;width:min(950px,100%);max-height:90vh;overflow:auto}.detailimage{background:#efedf2;min-height:450px;display:flex;align-items:center;justify-content:center}.detailimage img{width:100%;height:100%;max-height:80vh;object-fit:contain}.detailtext{padding:40px 32px}.detailtext h2{font-size:23px;line-height:1.5;font-weight:500;padding-right:20px}.detailtext .close{position:absolute;right:18px;top:16px}.source{font-size:12px;color:var(--muted)}textarea{width:100%;padding:16px;line-height:1.9;background:#f7f6f9;border:1px solid var(--line);border-radius:8px;resize:vertical;color:var(--ink)}.detailtext textarea{height:220px;margin:12px 0 16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.create{max-width:1000px;margin:auto}.create-layout{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:30px}.box{background:white;border:1px solid var(--line);border-radius:12px;padding:25px}.box h3{font-size:15px;font-weight:500;margin:0 0 18px}.upload{border:1px dashed #c8bfd0;border-radius:9px;margin-bottom:18px;padding:17px;text-align:center}.upload img{height:160px;width:100%;object-fit:contain;display:block;margin-bottom:10px}.upload p{color:var(--muted);font-size:12px}.uploadtitle{display:flex;justify-content:space-between;margin-bottom:12px;font-size:13px}.previewnote{font-size:11px;color:var(--muted)}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:50;background:#352c40;color:white;border-radius:9px;padding:13px 23px;box-shadow:0 5px 30px #0002}.hidden{display:none!important}.previewflag{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:3px 6px;letter-spacing:0}.brand{display:flex;align-items:center;gap:12px}.folderbar{display:flex;gap:8px;margin-bottom:18px}.folderbar button{font-size:12px;padding:7px 12px;border:1px solid var(--line);border-radius:6px}.folderbar .active{border-color:var(--purple);color:var(--purple)}
@media(min-width:1500px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}@media(max-width:900px){header{gap:22px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.create-layout{gap:18px}nav{gap:18px}.previewflag{display:none}}@media(max-width:600px){header{height:64px;padding:0 16px;gap:20px}.logo{font-size:23px}.brand{gap:0}nav{gap:14px}nav button{font-size:12px}.bag-trigger{padding:8px 10px;gap:6px;font-size:12px}main{padding:25px 18px 50px}.titleline{display:block}h1{font-size:30px}.search{width:100%;margin-top:20px}.tabs{gap:5px;margin:22px 0 16px;padding-bottom:15px}.tabs button{padding:8px 14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 13px}.meta{font-size:11px}.detail-overlay{padding:12px}.detail{display:block;max-height:92vh}.detailimage{min-height:0;height:36vh}.detailtext{padding:20px}.detailtext h2{font-size:19px}.detailtext textarea{height:130px}.detailtext .close{background:white;border-radius:50%}.create-layout{grid-template-columns:1fr}.panelhead{padding:24px 20px 18px}.bagbody{padding:20px}.foot{padding:16px 20px}.baggrid{gap:19px 10px}.folderbar{flex-wrap:wrap}.sub{font-size:12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.folderbar select{max-width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}button:disabled{opacity:.35;cursor:default}body:has(.overlay){overscroll-behavior:none}body:has(.drawer) header{visibility:hidden}body:has(.drawer) main{visibility:hidden}header{display:none;position:static;height:64px}main{padding-top:20px}h1{font-size:30px}body.bag-mode{background:transparent}.bag-mode .overlay{background:transparent}</style><header><div class="brand"><button class="logo" onclick="parent.postMessage({type:'portrait-navigate',view:'inspiration'},location.origin)">←</button></div><button class="bag-trigger" onclick="openBag()"><span>素材袋</span><span class="badge" id="count">0</span></button></header><main id="main"></main><div id="bag"></div><div id="detail"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
let materials=[],bag=[],category='全部',query='',view='studio',slots=[null,null],pick=null,bagOpen=false,detailId=null,previousFocus=null;let timer;const key='huashi-material-bag-v1';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const item=id=>materials.find(x=>x.id===id);let prompt='';let pageIndex=0,folder='';const mode=new URLSearchParams(location.search).get('mode');const pickKey=new URLSearchParams(location.search).get('pick');if(mode==='bag')document.body.classList.add('bag-mode');
function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>$('#toast').classList.add('hidden'),2300)}
function persist(){try{localStorage.setItem(key,JSON.stringify(bag))}catch(e){toast('浏览器保存失败，本次选择暂留在页面中')}$('#count').textContent=bag.length}
function toggle(id){if(bag.includes(id)){bag=bag.filter(x=>x!==id);toast('已移出素材袋')}else{bag.push(id);toast('已加入素材袋')}persist();if(view==='studio')renderGrid();if(bagOpen)renderBag();if(detailId)detail(detailId,false)}
function page(v){if(v==='create'){parent.postMessage({type:'portrait-navigate',view:'create'},location.origin);return}window.scrollTo(0,0);view=v;if(v==='studio'){ $('#main').innerHTML=`<div class="crumb">灵感屋 / 人像工坊</div><div class="titleline"><div><h1>人像工坊</h1><p class="sub">挑喜欢的图片，装进素材袋。创作时随手取用。</p></div><input class="search" aria-label="搜索素材" placeholder="搜索名称、参考词…" value="${esc(query)}" oninput="query=this.value;pageIndex=0;renderGrid()"></div><div class="tabs" id="tabs"></div><div class="folderbar"><select id="folder" aria-label="素材目录" onchange="folder=this.value;pageIndex=0;renderGrid()"></select></div><div class="meta"><span id="resultcount"></span><span>点图片看大图 · 点文字复制参考词</span></div><div class="grid" id="grid"></div><div id="pages" class="actions" style="justify-content:center;margin-top:30px"></div>`;renderTabs();renderFolders();renderGrid()}else renderCreate()}
function renderTabs(){$('#tabs').innerHTML=['全部','发型','发饰','服装','姿势','场景','镜头','光影','表情','人物','细节'].map(c=>`<button class="${c===category?'active':''}" onclick="category='${c}';folder='';pageIndex=0;renderTabs();renderFolders();renderGrid()">${c}</button>`).join('')}
function renderFolders(){const folders=[...new Set(materials.filter(x=>category==='全部'||x.category===category).map(x=>x.folder))];$('#folder').innerHTML='<option value="">全部目录</option>'+folders.map(f=>`<option value="${esc(f)}">${esc(f)}</option>`).join('');$('#folder').value=folder}
function renderGrid(){let rows=materials.filter(x=>(category==='全部'||x.category===category)&&(!folder||x.folder===folder)&&(!query||(x.title+x.words+x.folder).toLowerCase().includes(query.toLowerCase())));const total=Math.ceil(rows.length/30);pageIndex=Math.max(0,Math.min(pageIndex,total-1));$('#resultcount').textContent=`${category==='全部'?'全部素材':category} · ${rows.length.toLocaleString()} 张`;$('#grid').innerHTML=rows.length?rows.slice(pageIndex*30,pageIndex*30+30).map(x=>card(x)).join(''):'<div class="empty">没有找到匹配素材，试试其他关键词。</div>';$('#pages').innerHTML=total>1?`<button class="secondary" onclick="pageIndex--;renderGrid();window.scrollTo(0,0)" ${pageIndex===0?'disabled':''}>上一页</button><span style="align-self:center">${pageIndex+1} / ${total}</span><button class="secondary" onclick="pageIndex++;renderGrid();window.scrollTo(0,0)" ${pageIndex>=total-1?'disabled':''}>下一页</button>`:''}

function materialId(index){return materials[index]?.id||''}
function card(x,inBag=false){const position=materials.indexOf(x);let on=bag.includes(x.id);return `<article class="card"><div class="photo"><button aria-label="${pick!==null&&inBag?'选用':'查看'} ${esc(x.title)}" onclick="${pick!==null&&inBag?`choose(materialId(${position}))`:`detail(materialId(${position}))`}"><img src="${x.thumbnail||x.image}" alt="${esc(x.title)}" loading="lazy" decoding="async"></button>${!inBag?`<button class="add ${on?'on':''}" aria-label="${on?'移出':'加入'}素材袋：${esc(x.title)}" onclick="toggle(materialId(${position}))">${on?'✓':'＋'}</button>`:''}</div><div class="caption"><button class="name" title="${esc(x.title)}" onclick="detail(materialId(${position}))">${esc(x.title)}</button></div>${inBag?`<div class="tools"><button onclick="copyCard(materialId(${position}),this)">复制参考词</button><button onclick="toggle(materialId(${position}))">移出</button></div>`:`<button class="copyline" onclick="copyCard(materialId(${position}),this)" aria-label="复制参考词：${esc(x.title)}">复制参考词 ↗</button>`}</article>`}
function openBag(slot=null){previousFocus=document.activeElement;pick=slot;bagOpen=true;renderBag();document.body.style.overflow='hidden';$('#bag .close').focus()}
function renderBag(){$('#bag').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeBag()"><section class="drawer" role="dialog" aria-modal="true" aria-label="素材袋"><div class="panelhead"><div><h2>${pick===null?'素材袋':`从素材袋选图`} <span class="source">${bag.length}</span></h2><p>${pick===null?'图片和参考词，都放在这里。':'点一张图片选入当前上传口，素材仍保留。'}</p></div><button class="close" aria-label="关闭素材袋" onclick="closeBag()">×</button></div><div class="bagbody"><div class="baggrid">${bag.length?bag.map(id=>card(item(id),true)).join(''):'<div class="empty">素材袋还是空的<br>去人像工坊，点图片上的 ＋ 装入素材。</div>'}</div></div><div class="foot"><button onclick="clearBag()" ${bag.length?'':'disabled'}>清空素材袋</button><button class="primary" onclick="closeBag();page('${pick===null?'create':'studio'}')">${pick===null?'去创作间 →':'去挑素材 →'}</button></div></section></div>`}
function closeBag(){if(mode==='bag'){parent.postMessage({type:'portrait-close'},location.origin);return}$('#bag').innerHTML='';bagOpen=false;pick=null;document.body.style.overflow='';previousFocus?.focus()}
let clearArmed=false;
function clearBag(){if(!bag.length)return;if(!clearArmed){clearArmed=true;document.querySelector('[onclick="clearBag()"]').textContent='确认清空';toast('再点确认清空，原素材不会删除');return}bag=[];clearArmed=false;persist();renderBag();if(view==='studio')renderGrid();toast('素材袋已清空')}

function detail(id,focus=true){detailId=id;let x=item(id);const position=materials.indexOf(x);$('#detail').innerHTML=`<div class="overlay detail-overlay" onclick="if(event.target===this)closeDetail()"><section class="detail" role="dialog" aria-modal="true" aria-label="素材详情"><div class="detailimage"><img src="${x.image}" alt="${esc(x.title)}"></div><div class="detailtext"><button class="close" aria-label="关闭详情" onclick="closeDetail()">×</button><span class="source">${esc(x.category)}</span><h2>${esc(x.title)}</h2><div>参考词</div><p class="source">${esc(x.source)} · 可选中一部分复制</p><textarea id="words" aria-label="参考词" readonly>${esc(x.words)}</textarea><div class="actions"><button class="primary" onclick="copyWords()">复制参考词</button><button class="secondary" onclick="toggle(materialId(${position}))">${bag.includes(id)?'✓ 已装袋 · 移出':'＋ 装进素材袋'}</button>${pick!==null?`<button class="secondary" onclick="choose(materialId(${position}));closeDetail()">选入当前上传口</button>`:''}</div></div></section></div>`;document.body.style.overflow='hidden';if(focus)$('#detail .close').focus()}
function closeDetail(){$('#detail').innerHTML='';detailId=null;document.body.style.overflow=bagOpen?'hidden':'';if(bagOpen)$('#bag .close').focus()}
async function copyCard(id,button){
 const text=item(id).words;
 try{await navigator.clipboard.writeText(text)}catch(e){
  const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(area);area.select();const ok=document.execCommand('copy');area.remove();if(!ok){toast('复制未成功，请打开详情选中文字复制');return}
 }
 const original=button.textContent;button.textContent='✓ 已复制';button.classList.add('copied');toast('参考词已复制');setTimeout(()=>{button.textContent=original;button.classList.remove('copied')},1800);
}
async function copyWords(){let t=$('#words'),s=t.value.slice(t.selectionStart,t.selectionEnd)||t.value;try{await navigator.clipboard.writeText(s);toast(t.selectionEnd>t.selectionStart?'已复制选中文字':'已复制参考词')}catch(e){t.select();toast('请按 Ctrl/Cmd+C 复制选中文字')}}
function choose(id){parent.postMessage({type:'portrait-select',id,key:pickKey},location.origin)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(detailId)closeDetail();else if(bagOpen)closeBag()}if(e.key==='Tab'&&(detailId||bagOpen)){let p=$(detailId?'#detail .detail':'#bag .drawer');let a=[...p.querySelectorAll('button:not([disabled]),textarea,input')];let first=a[0],last=a[a.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
function loadMaterialCatalog(){const plain=()=>fetch('/portrait-materials.json?v=20261030-speed-1').then(r=>{if(!r.ok)throw Error('素材目录读取失败');return r.json()});if(typeof DecompressionStream!=='function')return plain();return fetch('/portrait-materials.json.gz?v=20261030-speed-1').then(r=>{if(!r.ok||!r.body)throw Error('compressed catalog unavailable');return new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).json()}).catch(plain)}
loadMaterialCatalog().then(data=>{materials=data;try{bag=JSON.parse(localStorage.getItem(key)||'[]').filter(id=>item(id))}catch(e){bag=[]}persist();if(mode==='bag'){view='bag';openBag(pickKey?0:null)}else page('studio')}).catch(()=>{$('#main').innerHTML='<p>素材载入失败，请通过本地预览地址打开。</p>'});
</script></html>
